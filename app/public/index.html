<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Simulator Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #333;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            background: #555;
            border: 4px solid #fff;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            pointer-events: none;
        }
        #reward {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 15px;
            border: 5px solid pink;
            z-index: 10;
        }
        #reward img {
            max-width: 400px;
            border-radius: 10px;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: pink;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">Distance: <span id="dist">0</span>m / 1000m</div>
    <canvas id="gameCanvas"></canvas>
    <div id="reward">
        <h1>YOU WON!</h1>
        <p>Your reward is here:</p>
        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000&auto=format&fit=crop" alt="Reward" id="rewardImg">
        <br>
        <button class="btn" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const distEl = document.getElementById('dist');
        const rewardEl = document.getElementById('reward');

        canvas.width = 800;
        canvas.height = 600;

        let distance = 0;
        const goal = 1000;
        let gameActive = true;

        const car = {
            x: 375,
            y: 500,
            w: 50,
            h: 80,
            speed: 0,
            accel: 0.2,
            friction: 0.98,
            maxSpeed: 10
        };

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (!gameActive) return;

            if (keys['ArrowUp']) car.speed += car.accel;
            if (keys['ArrowDown']) car.speed -= car.accel;

            car.speed *= car.friction;
            if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
            if (car.speed < -car.maxSpeed / 2) car.speed = -car.maxSpeed / 2;

            distance += car.speed / 10;
            if (distance < 0) distance = 0;
            distEl.innerText = Math.floor(distance);

            if (distance >= goal) {
                gameActive = false;
                rewardEl.style.display = 'block';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Road
            ctx.fillStyle = '#444';
            ctx.fillRect(200, 0, 400, canvas.height);
            
            // Lane markings
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(400, 0);
            ctx.lineTo(400, canvas.height);
            ctx.stroke();

            // Car
            ctx.fillStyle = 'red';
            ctx.fillRect(car.x, car.y, car.w, car.h);
            
            // Windows
            ctx.fillStyle = 'lightblue';
            ctx.fillRect(car.x + 5, car.y + 10, car.w - 10, 20);

            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        draw();
    </script>
</body>
</html>
